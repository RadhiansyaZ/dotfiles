# Shared starship prompt config.
# Default lookup path is $XDG_CONFIG_HOME/starship.toml (~/.config/starship.toml) on every
# platform, so this single file is used by zsh (macOS/Linux/WSL) and PowerShell (Windows).
# Native Windows symlinks this to %USERPROFILE%\.config\starship.toml.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$python\
$golang\
$nodejs\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[python]
symbol = " "

[golang]
symbol = " "

[nodejs]
symbol = " "
