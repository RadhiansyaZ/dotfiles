<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* Layout: fixed left index of documents, one reading column, wide blocks scroll inside themselves. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1a2230; --muted: #5d6b7e; --line: #dde2ea;
  --accent: #0b6e8f; --accent-soft: #e2f1f6; --code-bg: #eef1f5; --code-fg: #1f2a3a;
  --ok: #1d7a4a; --warn: #9a6200; --bad: #b3302a;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --panel: #171e28; --fg: #e3e8ef; --muted: #95a2b4; --line: #2a3442;
    --accent: #5cc0de; --accent-soft: #17323d; --code-bg: #0c1117; --code-fg: #d5dde8;
    --ok: #5fc48f; --warn: #e0b060; --bad: #ef8079; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --panel: #171e28; --fg: #e3e8ef; --muted: #95a2b4; --line: #2a3442;
  --accent: #5cc0de; --accent-soft: #17323d; --code-bg: #0c1117; --code-fg: #d5dde8;
  --ok: #5fc48f; --warn: #e0b060; --bad: #ef8079; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100%; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .01em; padding: 0 8px; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.tools { display: flex; gap: 6px; padding: 12px 8px 4px; }
.tools input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; }
.tools button { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 18px 8px 6px; font-weight: 600; }
nav a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 13.5px; line-height: 1.35; }
nav a:hover { background: var(--accent-soft); }
nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav a .hits { float: right; color: var(--muted); font-weight: 400; font-size: 11px; }
nav a.nohit { display: none; }
main { padding: 28px max(16px, 4vw) 80px; min-width: 0; }
.path { font: 12px var(--mono); color: var(--muted); margin-bottom: 6px; }
article { max-width: 980px; min-width: 0; }
article h1 { font-size: 28px; line-height: 1.2; margin: 0 0 18px; text-wrap: balance; }
article h2 { font-size: 20px; margin: 36px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); text-wrap: balance; }
article h3 { font-size: 16px; margin: 26px 0 8px; }
article h4 { font-size: 14px; margin: 20px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
article p, article li { max-width: 78ch; }
article a { color: var(--accent); }
article hr { border: 0; border-top: 1px solid var(--line); margin: 30px 0; }
article code { font: 12.5px var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
article pre { background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
article pre code { background: none; padding: 0; font-size: 12.5px; overflow-wrap: normal; white-space: pre; }
article pre .arrow { color: var(--accent); font-weight: 700; }
article pre .chan { color: var(--warn); font-weight: 600; }
article pre .llm { color: var(--bad); font-weight: 600; }
article pre .codetag { color: var(--ok); font-weight: 600; }
.tablewrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
article table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
article th, article td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
article th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
article tr:last-child td { border-bottom: 0; }
article blockquote { margin: 14px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
.mermaid-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; margin: 14px 0; text-align: center; }
.mermaid-box svg { max-width: none; height: auto; }
.mermaid-err { text-align: left; color: var(--bad); font: 12px var(--mono); white-space: pre-wrap; }
.ev { font: 600 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.ev-V { color: var(--ok); } .ev-R { color: var(--muted); } .ev-RT { color: var(--accent); }
mark { background: var(--warn); color: var(--bg); border-radius: 2px; padding: 0 1px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
.pager a { color: var(--accent); text-decoration: none; }
#menu { display: none; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav { position: fixed; inset: 0 20% 0 0; z-index: 5; transform: translateX(-100%); transition: transform .15s; }
  nav.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  #menu { display: inline-block; margin-bottom: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
}
@media (prefers-reduced-motion: reduce) { nav { transition: none; } }
@media print { nav, #menu, .pager { display: none; } .app { display: block; } }
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Documents">
    <div class="brand">__TITLE__<small>__SUBTITLE__</small></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search all documents" aria-label="Search all documents">
      <button id="theme" type="button" title="Switch light / dark">Theme</button>
    </div>
    <div id="navlist"></div>
  </nav>
  <main>
    <button id="menu" type="button">Documents</button>
    <div class="path" id="path"></div>
    <article id="doc"></article>
    <div class="pager" id="pager"></div>
  </main>
</div>
<script>/*__MARKED__*/</script>
<script>/*__MERMAID__*/</script>
<script>
const DATA = /*__DATA__*/null;
const order = DATA.nav.flatMap(g => g.items);
const slug = p => p.replace(/\.md$/, '').replace(/[^A-Za-z0-9]+/g, '-');
const bySlug = Object.fromEntries(order.map(i => [slug(i.path), i]));
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let query = '';

function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

function buildNav() {
  $('navlist').innerHTML = DATA.nav.map(g =>
    `<h2>${esc(g.group)}</h2>` + g.items.map(i =>
      `<a href="#${slug(i.path)}" data-path="${i.path}">${esc(i.title)}</a>`).join('')
  ).join('');
}

function resolve(from, href) {
  const parts = from.split('/').slice(0, -1);
  for (const seg of href.split('/')) {
    if (seg === '..') parts.pop(); else if (seg !== '.' && seg) parts.push(seg);
  }
  return parts.join('/');
}

function decorateGraph(code) {
  code.innerHTML = code.innerHTML
    .replace(/→/g, '<span class="arrow">→</span>')
    .replace(/(^|\s)([AERCVN]):(?=\s)/g, '$1<span class="chan">$2:</span>')
    .replace(/\[LLM[^\]]*\]/g, m => `<span class="llm">${m}</span>`)
    .replace(/\[code[^\]]*\]/g, m => `<span class="codetag">${m}</span>`);
}

function highlight(root, q) {
  if (!q) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const lq = q.toLowerCase();
  for (const n of nodes) {
    if (n.parentElement.closest('.mermaid-box')) continue;
    const i = n.nodeValue.toLowerCase().indexOf(lq);
    if (i < 0) continue;
    const hit = n.splitText(i); hit.splitText(q.length);
    const m = document.createElement('mark'); m.textContent = hit.nodeValue;
    hit.replaceWith(m);
  }
}

let renderSeq = 0;
async function show(item, anchor) {
  const seq = ++renderSeq;
  const doc = $('doc');
  doc.innerHTML = marked.parse(DATA.docs[item.path], { gfm: true })
    .replace(/\[(V|RT|R)\](?![^<]*<\/code>)/g, '<span class="ev ev-$1">$1</span>');
  $('path').textContent = DATA.meta.label + item.path;
  document.title = item.title + ' · ' + DATA.meta.title;

  doc.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.appendChild(t);
  });
  doc.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    h.id = 'h-' + h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  });
  doc.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    const [file, frag] = href.split('#');
    if (file.endsWith('.md')) {
      const target = [resolve(item.path, file), file].find(p => DATA.docs[p]);
      if (target) a.setAttribute('href', '#' + slug(target));
    } else if (!file && frag) {
      a.addEventListener('click', e => { e.preventDefault(); document.getElementById('h-' + frag)?.scrollIntoView(); });
    }
  });
  doc.querySelectorAll('pre > code').forEach(code => {
    if (code.classList.contains('language-mermaid')) return;
    if (code.textContent.includes('→')) decorateGraph(code);
  });
  highlight(doc, query);

  const i = order.indexOf(item);
  $('pager').innerHTML =
    (order[i - 1] ? `<a href="#${slug(order[i - 1].path)}">← ${esc(order[i - 1].title)}</a>` : '<span></span>') +
    (order[i + 1] ? `<a href="#${slug(order[i + 1].path)}">${esc(order[i + 1].title)} →</a>` : '<span></span>');
  document.querySelectorAll('#navlist a').forEach(a => a.classList.toggle('active', a.dataset.path === item.path));
  $('nav').classList.remove('open');
  window.scrollTo(0, 0);

  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'neutral',
    flowchart: { useMaxWidth: false }, sequence: { useMaxWidth: false } });
  let n = 0;
  for (const code of doc.querySelectorAll('pre > code.language-mermaid')) {
    const box = document.createElement('div'); box.className = 'mermaid-box';
    const src = code.textContent;
    code.parentElement.replaceWith(box);
    try {
      const { svg } = await mermaid.render(`m${seq}-${n++}`, src);
      if (seq !== renderSeq) return;
      box.innerHTML = svg;
    } catch (e) {
      box.innerHTML = `<div class="mermaid-err">Diagram could not be drawn: ${esc(String(e.message || e))}\n\n${esc(src)}</div>`;
    }
  }
}

function route() {
  const item = bySlug[location.hash.slice(1)] || order[0];
  show(item);
}

function search(q) {
  query = q.trim();
  const lq = query.toLowerCase();
  document.querySelectorAll('#navlist a').forEach(a => {
    a.querySelector('.hits')?.remove();
    if (!lq) { a.classList.remove('nohit'); return; }
    const count = DATA.docs[a.dataset.path].toLowerCase().split(lq).length - 1;
    a.classList.toggle('nohit', count === 0);
    if (count) a.insertAdjacentHTML('beforeend', `<span class="hits">${count}</span>`);
  });
  route();
}

buildNav();
addEventListener('hashchange', route);
let timer;
$('q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 200); });
$('theme').addEventListener('click', () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  route();
});
$('menu').addEventListener('click', () => $('nav').classList.toggle('open'));
route();
</script>
</body>
</html>
