onboarding = false
# Converted from ~/.tmux.conf
# Drop this at ~/.config/herdr/config.toml, then: herdr server reload-config

[keys]
prefix = "ctrl+a"          # was: set -g prefix C-a
previous_tab = "prefix+ctrl+p"   # was: bind C-p previous-window
next_tab = "prefix+ctrl+n"       # was: bind C-n next-window
split_vertical = "prefix+percent"   # was: bind % split-window -h
split_horizontal = "prefix+quote"   # was: bind '"' split-window -v

[theme]
name = "catppuccin"        # was: catppuccin/tmux, @catppuccin_flavour 'mocha'
                            # herdr's "catppuccin" IS the mocha/dark variant
                            # (light variant is "catppuccin-latte")

[session]
resume_agents_on_restore = true  # was: tmux-resurrect + tmux-continuum
                                  # + timvw/tmux-assistant-resurrect
                                  # herdr restores agent panes into their
                                  # native conversation state natively —
                                  # no plugin needed

[ui]
mouse_capture = true       # was: set -g mouse on (this is herdr's default anyway)

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "system"
