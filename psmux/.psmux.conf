# Plugins – install PPM first, then use Prefix + I to install these.
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# tmux-assistant-resurrect has no psmux equivalent.

set -g @catppuccin-flavor 'mocha'

set -g mouse on
set -g prefix C-a

# Focus events enabled for terminals that support them.
set -g focus-events on

# Useful when using grouped sessions and a multi-monitor setup.
setw -g aggressive-resize on

set -g @continuum-restore 'on'

# Easier and faster switching between next/previous windows.
bind C-p previous-window
bind C-n next-window

# Initialize PPM. Keep this line at the bottom of this file.
run '~/.psmux/plugins/ppm/ppm.ps1'
