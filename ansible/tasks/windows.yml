---
# Provision the native Windows host (runs over SSH from the WSL controller).
# Requires collections: ansible.windows, community.windows.

# --------------------------------------------------------------------------- packages
- name: Install winget packages from manifest
  ansible.windows.win_shell: >-
    winget import --import-file "{{ windows_winget_manifest }}"
    --accept-package-agreements --accept-source-agreements --ignore-versions --no-upgrade
  register: winget_import
  changed_when: "'Successfully installed' in winget_import.stdout"
  # winget returns non-zero when some packages are already installed / not upgraded; tolerate it.
  failed_when: false
  tags: [windows, packages]

# --------------------------------------------------------------------------- node (nvm-windows)
# nvm-windows is installed by the winget manifest (CoreyButler.NVMforWindows). Install the LTS
# Node.js and activate it. Unlike unix nvm, `nvm use` flips a symlink that is permanently on
# PATH, so `node --version` works directly in any new shell afterwards.
- name: Install Node.js LTS via nvm-windows
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    # Refresh PATH from the registry: nvm-windows was just installed by winget, but the SSH
    # session PATH was captured at connect time and predates it. Read both scopes (MSI
    # installs write Machine PATH; portable packages write User PATH).
    $env:PATH = (@(
      [Environment]::GetEnvironmentVariable('Path', 'Machine'),
      [Environment]::GetEnvironmentVariable('Path', 'User')
    ) | Where-Object { $_ }) -join ';'
    nvm install lts
    nvm use lts
  register: nvm_win_lts
  changed_when: "'is already installed' not in nvm_win_lts.stdout"
  failed_when: false
  tags: [windows, packages]

# --------------------------------------------------------------------------- C/C++ toolchain
# tree-sitter / nvim-treesitter compile parsers with a C/C++ compiler. Install the MSVC build
# tools. The winget import manifest can only list package IDs, so it cannot request the C++
# workload — hence this dedicated install with --override to add the VCTools workload.
- name: Install Visual Studio Build Tools (MSVC C++)
  ansible.windows.win_shell: >-
    winget install --id Microsoft.VisualStudio.2022.BuildTools --exact --silent
    --accept-package-agreements --accept-source-agreements
    --override "--quiet --wait --norestart --nocache
    --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
  register: msvc_install
  # winget returns non-zero when already installed / no applicable upgrade; tolerate it.
  changed_when: "'Successfully installed' in msvc_install.stdout"
  failed_when: false
  tags: [windows, packages]

# --------------------------------------------------------------------------- tree-sitter
# No winget package exists for the tree-sitter CLI, so pull the latest release binary directly.
- name: Ensure tree-sitter install directory
  ansible.windows.win_file:
    path: "{{ windows_treesitter_dir }}"
    state: directory
  tags: [windows, packages]

- name: Download tree-sitter CLI
  ansible.windows.win_get_url:
    url: "https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-cli-windows-x64.zip"
    dest: C:\Windows\Temp\tree-sitter-cli-windows-x64.zip
  tags: [windows, packages]

- name: Extract tree-sitter CLI
  community.windows.win_unzip:
    src: C:\Windows\Temp\tree-sitter-cli-windows-x64.zip
    dest: "{{ windows_treesitter_dir }}"
    creates: "{{ windows_treesitter_dir }}\\tree-sitter.exe"
  tags: [windows, packages]

- name: Add tree-sitter to user PATH
  ansible.windows.win_path:
    elements: "{{ windows_treesitter_dir }}"
    scope: user
    state: present
  tags: [windows, packages]

# --------------------------------------------------------------------------- PS modules
- name: Ensure NuGet package provider (for PSGallery installs)
  ansible.windows.win_shell: |
    if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
      Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
      Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
    }
  changed_when: false
  tags: [windows, shell]

- name: Install PowerShell modules
  # Use Install-Module directly instead of community.windows.win_psmodule: under SSH the modules
  # run in pwsh 7, which loads the legacy PowerShellGet 1.0.0.1 from the WindowsPowerShell module
  # path. win_psmodule passes -AcceptLicense, which that old PowerShellGet does not support. A
  # plain Install-Module works with old or new PowerShellGet; -Force bypasses the trust prompt.
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (-not (Get-Module -ListAvailable -Name '{{ item }}')) {
      Install-Module -Name '{{ item }}' -Scope CurrentUser -Force
      Write-Output 'CHANGED'
    } else {
      Write-Output 'OK'
    }
  register: win_psmodule_result
  changed_when: "'CHANGED' in win_psmodule_result.stdout"
  loop: "{{ windows_ps_modules }}"
  tags: [windows, shell]

# --------------------------------------------------------------------------- fonts
- name: Ensure temp font download directory
  ansible.windows.win_file:
    path: C:\Windows\Temp\nerdfonts
    state: directory
  tags: [windows, fonts]

- name: Download Nerd Font archives
  ansible.windows.win_get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item }}.zip"
    dest: "C:\\Windows\\Temp\\nerdfonts\\{{ item }}.zip"
  loop: "{{ nerd_fonts }}"
  tags: [windows, fonts]

- name: Extract Nerd Font archives
  community.windows.win_unzip:
    src: "C:\\Windows\\Temp\\nerdfonts\\{{ item }}.zip"
    dest: "C:\\Windows\\Temp\\nerdfonts\\{{ item }}"
    creates: "C:\\Windows\\Temp\\nerdfonts\\{{ item }}"
  loop: "{{ nerd_fonts }}"
  tags: [windows, fonts]

- name: Install Nerd Fonts (per-user) and register them
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $dest = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
    New-Item -ItemType Directory -Force -Path $dest | Out-Null
    $regPath = 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts'
    $changed = $false
    Get-ChildItem -Path "C:\Windows\Temp\nerdfonts\{{ item }}" -Recurse -Include *.ttf,*.otf |
      Where-Object { $_.Name -notlike '._*' } | ForEach-Object {
        $target = Join-Path $dest $_.Name
        if (-not (Test-Path $target)) {
          Copy-Item $_.FullName $target -Force
          New-ItemProperty -Path $regPath -Name ("$($_.BaseName) (TrueType)") -Value $_.Name -PropertyType String -Force | Out-Null
          $changed = $true
        }
      }
    if ($changed) { Write-Output 'CHANGED' } else { Write-Output 'OK' }
  register: font_install
  changed_when: "'CHANGED' in font_install.stdout"
  loop: "{{ nerd_fonts }}"
  tags: [windows, fonts]

# --------------------------------------------------------------------------- config symlinks
- name: Deploy config symlinks (Stow replacement)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $src  = "{{ item.src }}"
    $dest = [Environment]::ExpandEnvironmentVariables("{{ item.dest }}")
    if (-not (Test-Path $src)) { Write-Output "SKIP-missing-src"; return }
    $parent = Split-Path -Parent $dest
    if (-not (Test-Path $parent)) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
    $needsLink = $true
    if (Test-Path $dest) {
      $li = Get-Item $dest -Force
      if ($li.LinkType -eq 'SymbolicLink' -and ($li.Target -contains $src)) { $needsLink = $false }
    }
    if ($needsLink) {
      if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
      New-Item -ItemType SymbolicLink -Path $dest -Target $src | Out-Null
      Write-Output 'CHANGED'
    } else { Write-Output 'OK' }
  register: symlink_result
  changed_when: "'CHANGED' in symlink_result.stdout"
  loop: "{{ windows_symlinks }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [windows, stow]

# --------------------------------------------------------------------------- zed settings (copy)
# Zed is deliberately NOT symlinked: its "open settings" palette action breaks on a symlink to
# a \\wsl.localhost target. Run the repo's sync script (from the WSL repo over the UNC share) to
# drop a real local copy in %APPDATA%\Zed instead.
- name: Sync Zed settings from the WSL repo (local copy; symlink breaks Zed's settings UI)
  ansible.windows.win_shell: |
    & "{{ wsl_repo_unc }}\windows\sync-zed-settings.ps1" -Source "{{ wsl_repo_unc }}\zed\.config\zed\settings.json"
  register: zed_sync
  changed_when: "'CHANGED' in zed_sync.stdout"
  tags: [windows, stow]

# --------------------------------------------------------------------------- verify
# Mirrors windows/setup-windows.ps1: refresh PATH from the registry (so binaries installed
# this run are resolvable in this task's shell), then check each shell tool and report any
# that are missing instead of failing the play.
- name: Verify shell tools are on PATH
  ansible.windows.win_shell: |
    $env:PATH = (@(
      [Environment]::GetEnvironmentVariable('Path', 'Machine'),
      [Environment]::GetEnvironmentVariable('Path', 'User')
    ) | Where-Object { $_ }) -join ';'
    $tools = 'starship','fzf','zoxide','git','nvim','rg','eza','bat'
    $missing = @()
    foreach ($t in $tools) {
      if (Get-Command $t -ErrorAction SilentlyContinue) { Write-Output "OK   $t" }
      else { Write-Output "MISS $t"; $missing += $t }
    }
    if ($missing.Count -gt 0) { Write-Output ("MISSING: " + ($missing -join ', ')) }
  register: verify_tools
  changed_when: false
  failed_when: false
  tags: [windows, verify]

- name: Show tool verification result
  ansible.builtin.debug:
    var: verify_tools.stdout_lines
  tags: [windows, verify]
