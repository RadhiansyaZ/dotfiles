---
# Install Neovim on Linux only when it is absent. The release tarball ships both the
# executable and its runtime tree, so it cannot use the generic single-binary installer.

- name: Check Neovim installation
  ansible.builtin.command: which nvim
  register: nvim_check
  changed_when: false
  failed_when: false
  tags: [linux, nvim, packages]

- name: Install Neovim from latest release when missing
  when: nvim_check.rc != 0
  block:
    - name: Fetch latest Neovim release
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        return_content: true
      register: nvim_release

    - name: Select Neovim release asset
      ansible.builtin.set_fact:
        nvim_asset_url: >-
          {{ (nvim_release.json.assets
              | selectattr('browser_download_url', 'search', 'nvim-linux-' ~ linux_nvim_arch ~ '\\.tar\\.gz')
              | map(attribute='browser_download_url')
              | list
              | first) | default('') }}

    - name: Create temporary directory for Neovim
      ansible.builtin.tempfile:
        state: directory
        suffix: -nvim
      register: nvim_tmp
      when: nvim_asset_url | length > 0

    - name: Download Neovim tarball
      ansible.builtin.get_url:
        url: "{{ nvim_asset_url }}"
        dest: "{{ nvim_tmp.path }}/nvim.tar.gz"
        mode: "0644"
      when: nvim_asset_url | length > 0

    - name: Extract Neovim into /opt
      become: true
      ansible.builtin.unarchive:
        src: "{{ nvim_tmp.path }}/nvim.tar.gz"
        dest: /opt
        remote_src: true
      when: nvim_asset_url | length > 0

    - name: Symlink Neovim into /usr/local/bin
      become: true
      ansible.builtin.file:
        src: "/opt/nvim-linux-{{ linux_nvim_arch }}/bin/nvim"
        dest: /usr/local/bin/nvim
        state: link
        force: true
      when: nvim_asset_url | length > 0

    - name: Remove temporary directory for Neovim
      ansible.builtin.file:
        path: "{{ nvim_tmp.path }}"
        state: absent
      when:
        - nvim_tmp is defined
        - nvim_tmp.path is defined

    - name: Warn when no Neovim release asset matched
      ansible.builtin.debug:
        msg: "No nvim-linux-{{ linux_nvim_arch }}.tar.gz asset found in the latest Neovim release."
      when: nvim_asset_url | length == 0
