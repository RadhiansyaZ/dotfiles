---
- name: Map Linux architecture
  ansible.builtin.set_fact:
    linux_arch: >-
      {{ 'amd64' if ansible_facts.architecture == 'x86_64'
         else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
         else 'unsupported' }}
    linux_goarch: >-
      {{ 'amd64' if ansible_facts.architecture == 'x86_64'
         else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
         else 'unsupported' }}
    linux_aws_arch: >-
      {{ 'x86_64' if ansible_facts.architecture == 'x86_64'
         else 'aarch64' if ansible_facts.architecture in ['aarch64', 'arm64']
         else 'unsupported' }}
    linux_nvim_arch: >-
      {{ 'x86_64' if ansible_facts.architecture == 'x86_64'
         else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
         else 'unsupported' }}
    linux_ts_arch: >-
      {{ 'x64' if ansible_facts.architecture == 'x86_64'
         else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
         else 'unsupported' }}

- name: Reject unsupported Linux architecture
  ansible.builtin.fail:
    msg: "Unsupported architecture: {{ ansible_facts.architecture }}. Supported: x86_64, aarch64, arm64."
  when: linux_arch == 'unsupported'
