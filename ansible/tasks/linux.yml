---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'
  tags: [linux, packages]

- name: Install base Linux dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ linux_base_packages }}"
    state: present
    install_recommends: false
  when: ansible_facts.os_family == 'Debian'
  tags: [linux, packages]

- name: Install Linux CLI packages
  become: true
  ansible.builtin.apt:
    name: "{{ linux_cli_packages }}"
    state: present
  when: ansible_facts.os_family == 'Debian'
  tags: [linux, packages]

- name: Ensure local bin directory exists
  # Created here (not only in common.yml, which runs later) because the symlink tasks below
  # write into it. On a fresh host ~/.local/bin does not pre-exist, so this must come first.
  ansible.builtin.file:
    path: "{{ local_bin_dir }}"
    state: directory
    mode: "0755"
  tags: [linux, packages]

- name: Create bat symlink
  ansible.builtin.file:
    src: "{{ lookup('ansible.builtin.pipe', 'command -v batcat || true') }}"
    dest: "{{ local_bin_dir }}/bat"
    state: link
    force: true
  when: lookup('ansible.builtin.pipe', 'command -v batcat || true') | length > 0
  tags: [linux, packages]

- name: Create fd symlink
  ansible.builtin.file:
    src: "{{ lookup('ansible.builtin.pipe', 'command -v fdfind || true') }}"
    dest: "{{ local_bin_dir }}/fd"
    state: link
    force: true
  when: lookup('ansible.builtin.pipe', 'command -v fdfind || true') | length > 0
  tags: [linux, packages]

- name: Check GitHub CLI installation
  ansible.builtin.command: which gh
  register: linux_gh_check
  changed_when: false
  failed_when: false
  tags: [linux, packages]

- name: Add GitHub CLI key
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /etc/apt/keyrings
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
    chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/githubcli-archive-keyring.gpg
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_gh_check.rc != 0
  tags: [linux, packages]

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ linux_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_gh_check.rc != 0
  tags: [linux, packages]

- name: Check eza installation
  ansible.builtin.command: which eza
  register: linux_eza_check
  changed_when: false
  failed_when: false
  tags: [linux, packages]

- name: Add eza key
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /etc/apt/keyrings
    wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc \
      | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
    chmod 644 /etc/apt/keyrings/gierens.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/gierens.gpg
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_eza_check.rc != 0
  tags: [linux, packages]

- name: Add eza apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
    filename: gierens
    state: present
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_eza_check.rc != 0
  tags: [linux, packages]

- name: Install GitHub CLI when missing
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_gh_check.rc != 0
  tags: [linux, packages]

- name: Install eza when missing
  become: true
  ansible.builtin.apt:
    name: eza
    state: present
    update_cache: true
  when:
    - ansible_facts.os_family == 'Debian'
    - linux_eza_check.rc != 0
  tags: [linux, packages]

- name: Check Go installation
  ansible.builtin.command: which go
  register: linux_go_check
  changed_when: false
  failed_when: false
  tags: [linux, go]

- name: Fetch latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: go_version_response
  when: linux_go_check.rc != 0
  tags: [linux, go]

- name: Set Go version
  ansible.builtin.set_fact:
    go_version: "{{ (go_version_response.content.splitlines() | first | default('go1.23.0')) | regex_replace('^go', '') }}"
  when: linux_go_check.rc != 0
  tags: [linux, go]

- name: Download Go tarball
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-{{ linux_goarch }}.tar.gz"
    dest: "/tmp/go{{ go_version }}.linux-{{ linux_goarch }}.tar.gz"
    mode: "0644"
  when: linux_go_check.rc != 0
  tags: [linux, go]

- name: Remove old Go installation
  become: true
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when: linux_go_check.rc != 0
  tags: [linux, go]

- name: Install Go tarball
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/go{{ go_version }}.linux-{{ linux_goarch }}.tar.gz"
    dest: /usr/local
    remote_src: true
    creates: /usr/local/go/bin/go
  when: linux_go_check.rc != 0
  tags: [linux, go]

- name: Check Starship installation
  ansible.builtin.command: which starship
  register: linux_starship_check
  changed_when: false
  failed_when: false
  tags: [linux, packages]

- name: Download Starship installer when missing
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship-install.sh
    mode: "0755"
  when: linux_starship_check.rc != 0
  tags: [linux, packages]

- name: Install Starship when missing
  become: true
  ansible.builtin.command: /tmp/starship-install.sh --yes
  when: linux_starship_check.rc != 0
  tags: [linux, packages]

- name: Check zoxide installation
  ansible.builtin.command: which zoxide
  register: linux_zoxide_check
  changed_when: false
  failed_when: false
  tags: [linux, packages]

- name: Download zoxide installer when missing
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh
    dest: /tmp/zoxide-install.sh
    mode: "0755"
  when: linux_zoxide_check.rc != 0
  tags: [linux, packages]

- name: Install zoxide when missing
  ansible.builtin.command: /tmp/zoxide-install.sh
  when: linux_zoxide_check.rc != 0
  tags: [linux, packages]

- name: Check nvm installation
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ansible_facts.env.HOME }}/.config/nvm/nvm.sh"
    - "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
  register: linux_nvm_files
  changed_when: false
  tags: [linux, node]

- name: Set nvm installation state
  ansible.builtin.set_fact:
    linux_nvm_installed: "{{ linux_nvm_files.results | selectattr('stat.exists') | list | length > 0 }}"
    linux_nvm_script: >-
      {{ (linux_nvm_files.results | selectattr('stat.exists') | map(attribute='item') | list | first)
         | default(ansible_facts.env.HOME ~ '/.config/nvm/nvm.sh', true) }}
  tags: [linux, node]

- name: Download nvm installer when missing
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/HEAD/install.sh
    dest: /tmp/nvm-install.sh
    mode: "0755"
  when: not (linux_nvm_installed | bool)
  tags: [linux, node]

- name: Install nvm when missing
  ansible.builtin.command: bash /tmp/nvm-install.sh
  when: not (linux_nvm_installed | bool)
  environment:
    # zsh/.zshrc sources nvm from ~/.config/nvm, so install there (not the default ~/.nvm).
    NVM_DIR: "{{ ansible_facts.env.HOME }}/.config/nvm"
    # ~/.zshrc is a stow symlink into this repo; stop the installer appending source lines to it.
    PROFILE: /dev/null
  tags: [linux, node]

- name: Check Node.js installation
  ansible.builtin.command: which node
  register: linux_node_check
  changed_when: false
  failed_when: false
  tags: [linux, node]

- name: Install Node.js LTS and set as default when missing
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ linux_nvm_script | dirname }}"
    . "{{ linux_nvm_script }}"
    nvm install --lts
    nvm alias default 'lts/*'
  args:
    executable: /bin/bash
  when: linux_node_check.rc != 0
  tags: [linux, node]

- name: Check pnpm installation
  ansible.builtin.command: which pnpm
  register: linux_pnpm_check
  changed_when: false
  failed_when: false
  tags: [linux, node]

- name: Download pnpm installer when missing
  ansible.builtin.get_url:
    url: https://get.pnpm.io/install.sh
    dest: /tmp/pnpm-install.sh
    mode: "0755"
  when: linux_pnpm_check.rc != 0
  tags: [linux, node]

- name: Install pnpm when missing
  ansible.builtin.command: sh /tmp/pnpm-install.sh
  when: linux_pnpm_check.rc != 0
  tags: [linux, node]

- name: Check uv installation
  ansible.builtin.command: which uv
  register: linux_uv_check
  changed_when: false
  failed_when: false
  tags: [linux, python]

- name: Download uv installer when missing
  ansible.builtin.get_url:
    url: https://astral.sh/uv/install.sh
    dest: /tmp/uv-install.sh
    mode: "0755"
  when: linux_uv_check.rc != 0
  tags: [linux, python]

- name: Install uv when missing
  ansible.builtin.command: sh /tmp/uv-install.sh
  when: linux_uv_check.rc != 0
  tags: [linux, python]

- name: Check AWS CLI installation
  ansible.builtin.command: which aws
  register: aws_check
  changed_when: false
  failed_when: false
  tags: [linux, packages]

- name: Download AWS CLI v2
  ansible.builtin.unarchive:
    src: "https://awscli.amazonaws.com/awscli-exe-linux-{{ linux_aws_arch }}.zip"
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install
  when: aws_check.rc != 0
  tags: [linux, packages]

- name: Install AWS CLI v2
  become: true
  ansible.builtin.command: /tmp/aws/install
  changed_when: aws_check.rc != 0
  when: aws_check.rc != 0
  tags: [linux, packages]

- name: Install Neovim from latest release
  ansible.builtin.include_tasks: linux_nvim.yml
  tags: [linux, nvim, packages]

- name: Install GitHub release binaries
  ansible.builtin.include_tasks: linux_github_binary.yml
  loop: "{{ linux_github_binaries }}"
  loop_control:
    loop_var: github_binary
  tags: [linux, packages]

- name: Install direct binary downloads
  ansible.builtin.include_tasks: linux_direct_binary.yml
  loop: "{{ linux_direct_binaries }}"
  loop_control:
    loop_var: direct_binary
  tags: [linux, packages]

- name: Check pre-commit installation
  ansible.builtin.command: which pre-commit
  register: linux_pre_commit_check
  changed_when: false
  failed_when: false
  tags: [linux, python]

- name: Install pre-commit when missing
  # Debian 12+/Ubuntu 24.04+ mark the system Python as externally managed (PEP 668), so a
  # plain `pip install --user` fails with "externally-managed-environment".
  # --break-system-packages bypasses that guard; combined with --user the install still lands
  # in ~/.local and never touches system site-packages.
  ansible.builtin.pip:
    name: pre-commit
    executable: pip3
    extra_args: --user --break-system-packages
  when: linux_pre_commit_check.rc != 0
  tags: [linux, python]
