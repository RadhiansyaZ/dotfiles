---
- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ local_bin_dir }}"
    state: directory
    mode: "0755"
  tags: [common]

- name: Detect WSL
  ansible.builtin.set_fact:
    is_wsl: "{{ 'microsoft' in (ansible_facts.kernel | default('') | lower) }}"
  tags: [always]

- name: Compute effective stow packages
  # On WSL, ssh config is deployed natively (0600 real file) instead of stowed off /mnt/c,
  # where DrvFs reports world-writable perms that OpenSSH rejects. Native Linux/macOS keep
  # stowing it as before.
  ansible.builtin.set_fact:
    effective_stow_packages: "{{ stow_packages | difference(['ssh']) if is_wsl else stow_packages }}"
  tags: [stow]

- name: Ensure default shell is zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ lookup('ansible.builtin.pipe', 'command -v zsh') }}"
  when: lookup('ansible.builtin.pipe', 'command -v zsh') | length > 0
  tags: [shell]

- name: Ensure manual zsh plugin directory exists
  ansible.builtin.file:
    path: "{{ zsh_plugin_dir }}"
    state: directory
    mode: "0755"
  tags: [shell]

- name: Clone manual zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ zsh_plugin_dir }}/{{ item.name }}"
    version: master
    update: false
  loop: "{{ zsh_plugins }}"
  tags: [shell]

- name: Find plain-file stow conflicts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ stow_conflict_files }}"
  register: stow_conflict_stats
  tags: [stow]

- name: Remove plain-file stow conflicts
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ stow_conflict_stats.results }}"
  when:
    - item.stat.exists
    - item.stat.isreg
    - not item.stat.islnk
  tags: [stow]

- name: Run stow dry-run validation
  ansible.builtin.command:
    argv: "{{ stow_common_args + ['-nv', '--restow', item] }}"
  loop: "{{ effective_stow_packages }}"
  changed_when: false
  tags: [stow]

- name: Stow dotfile packages
  ansible.builtin.command:
    argv: "{{ stow_common_args + ['--restow', item] }}"
  loop: "{{ effective_stow_packages }}"
  changed_when: true
  tags: [stow]

- name: Deploy ssh config natively on WSL
  # WSL only: install ~/.ssh/config as a real 0600 file sourced from the repo, replacing any
  # prior /mnt/c symlink. Keeps WSL and Windows ssh configs independent — the Windows play
  # still deploys its own. "if any": skip silently when the repo has no ssh config.
  when: is_wsl
  block:
    - name: Check repo ssh config exists
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/ssh/.ssh/config"
      register: wsl_ssh_config_src

    - name: Ensure ~/.ssh exists (0700)
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.ssh"
        state: directory
        mode: "0700"
      when: wsl_ssh_config_src.stat.exists

    - name: Install ssh config as a native 0600 file
      ansible.builtin.copy:
        src: "{{ dotfiles_dir }}/ssh/.ssh/config"
        dest: "{{ ansible_facts.env.HOME }}/.ssh/config"
        mode: "0600"
        remote_src: true
        follow: false
      when: wsl_ssh_config_src.stat.exists
  tags: [stow, ssh]

- name: Select font directory
  ansible.builtin.set_fact:
    font_dir: "{{ ansible_facts.env.HOME }}/Library/Fonts"
  when: ansible_facts.system == 'Darwin'
  tags: [fonts]

- name: Select Linux font directory
  ansible.builtin.set_fact:
    font_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
  when: ansible_facts.system == 'Linux'
  tags: [fonts]

- name: Ensure font directory exists
  ansible.builtin.file:
    path: "{{ font_dir }}"
    state: directory
    mode: "0755"
  tags: [fonts]

- name: Install Nerd Fonts
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item }}.zip"
    dest: "{{ font_dir }}"
    remote_src: true
    creates: "{{ font_dir }}/{{ item }}NerdFontMono-Regular.ttf"
  loop: "{{ nerd_fonts }}"
  tags: [fonts]

- name: Remove macOS font metadata files
  ansible.builtin.shell: "find {{ font_dir | quote }} -name '._*' -delete"
  changed_when: false
  tags: [fonts]

- name: Refresh Linux font cache
  ansible.builtin.command: "fc-cache -f {{ font_dir }}"
  changed_when: false
  when: ansible_facts.system == 'Linux'
  tags: [fonts]

- name: Clone Tmux Plugin Manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm"
    version: master
    update: false
  tags: [tmux]

- name: Install tmux plugins
  ansible.builtin.shell: |
    set -euo pipefail
    tmux start-server
    "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm/bin/install_plugins"
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  tags: [tmux]

- name: Install Go tools
  ansible.builtin.command: "go install {{ item.module }}@latest"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_facts.env.HOME }}/go/bin:{{ ansible_facts.env.PATH }}"
  loop: "{{ go_tools }}"
  args:
    creates: "{{ ansible_facts.env.HOME }}/go/bin/{{ item.binary }}"
  # Go was just installed to /usr/local/go in the Linux play and may not be on the controller
  # PATH yet, so also probe that known location — otherwise these tools are silently skipped
  # on a fresh host. (The task itself prepends /usr/local/go/bin to PATH via `environment`.)
  when: lookup('ansible.builtin.pipe', 'command -v go 2>/dev/null || (test -x /usr/local/go/bin/go && echo found) || true') | length > 0
  tags: [go]
