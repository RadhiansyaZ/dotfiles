---
- name: Check Xcode Command Line Tools
  ansible.builtin.command: xcode-select -p
  register: xcode_clt
  changed_when: false
  failed_when: false
  tags: [macos, packages]

- name: Start Xcode Command Line Tools installer when missing
  ansible.builtin.command: xcode-select --install
  when: xcode_clt.rc != 0
  changed_when: true
  failed_when: false
  tags: [macos, packages]

- name: Stop when Xcode Command Line Tools must be installed manually
  ansible.builtin.fail:
    msg: "Xcode Command Line Tools installer launched. Complete install, then rerun setup.sh."
  when: xcode_clt.rc != 0
  tags: [macos, packages]

- name: Check Go
  ansible.builtin.command: go version
  register: macos_go_check
  changed_when: false
  failed_when: false
  tags: [macos, go]

- name: Fetch latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: macos_go_version_response
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Set Go version
  ansible.builtin.set_fact:
    macos_go_version: "{{ (macos_go_version_response.content.splitlines() | first | default('go1.23.0')) | regex_replace('^go', '') }}"
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Select Go architecture
  ansible.builtin.set_fact:
    macos_goarch: "{{ 'arm64' if ansible_facts.architecture == 'arm64' else 'amd64' }}"
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Download Go package
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ macos_go_version }}.darwin-{{ macos_goarch }}.pkg"
    dest: "/tmp/go{{ macos_go_version }}.darwin-{{ macos_goarch }}.pkg"
    mode: "0644"
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Install Go package
  become: true
  ansible.builtin.command:
    argv:
      - installer
      - -pkg
      - "/tmp/go{{ macos_go_version }}.darwin-{{ macos_goarch }}.pkg"
      - -target
      - /
  changed_when: true
  when: macos_go_check.rc != 0
  tags: [macos, go]

# --------------------------------------------------------------------------- Homebrew
- name: Check Homebrew
  ansible.builtin.command: command -v brew
  register: macos_brew_check
  changed_when: false
  failed_when: false
  tags: [macos, brew, packages]

- name: Install Homebrew
  ansible.builtin.shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when: macos_brew_check.rc != 0
  tags: [macos, brew, packages]

- name: Locate brew binary
  # brew is not yet on the Ansible session PATH right after install; resolve its absolute path
  # (Apple Silicon: /opt/homebrew, Intel: /usr/local) for the tasks below.
  ansible.builtin.shell: |
    for b in /opt/homebrew/bin/brew /usr/local/bin/brew; do
      [ -x "$b" ] && { echo "$b"; exit 0; }
    done
    command -v brew
  register: macos_brew_bin
  changed_when: false
  tags: [macos, brew, packages]

- name: Apply Brewfile (brew bundle)
  # Pipe a filtered Brewfile over stdin: `go` entries are installed by common.yml (go install)
  # and `npm` entries below — neither is a command `brew bundle` understands.
  ansible.builtin.shell: |
    set -o pipefail
    eval "$({{ macos_brew_bin.stdout }} shellenv)"
    grep -vE '^(go|npm)[[:space:]]' "{{ dotfiles_dir }}/Brewfile" | brew bundle --file=-
  args:
    executable: /bin/bash
  register: macos_brew_bundle
  changed_when: "'Installing' in macos_brew_bundle.stdout"
  tags: [macos, brew, packages]

# --------------------------------------------------------------------------- node (nvm)
- name: Ensure NVM_DIR exists
  # Homebrew nvm (from the Brewfile) does not create its working dir; zsh/.homebrew.zshrc
  # sources from ~/.nvm.
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.nvm"
    state: directory
    mode: "0755"
  tags: [macos, node]

- name: Install Node.js LTS and set as default (nvm)
  ansible.builtin.shell: |
    set -e
    eval "$({{ macos_brew_bin.stdout }} shellenv)"
    export NVM_DIR="$HOME/.nvm"
    . "$(brew --prefix nvm)/nvm.sh"
    nvm install --lts
    nvm alias default 'lts/*'
  args:
    executable: /bin/zsh
  register: macos_nvm_lts
  changed_when: "'is already installed' not in macos_nvm_lts.stderr"
  tags: [macos, node]

- name: Install global npm packages
  ansible.builtin.shell: |
    set -e
    eval "$({{ macos_brew_bin.stdout }} shellenv)"
    export NVM_DIR="$HOME/.nvm"
    . "$(brew --prefix nvm)/nvm.sh"
    nvm use default >/dev/null
    npm install -g {{ npm_packages | join(' ') }}
  args:
    executable: /bin/zsh
  register: macos_npm_global
  changed_when: "'added' in macos_npm_global.stdout or 'changed' in macos_npm_global.stdout"
  tags: [macos, node]
