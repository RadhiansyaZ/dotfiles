---
- name: Check Xcode Command Line Tools
  ansible.builtin.command: xcode-select -p
  register: xcode_clt
  changed_when: false
  failed_when: false
  tags: [macos, packages]

- name: Start Xcode Command Line Tools installer when missing
  ansible.builtin.command: xcode-select --install
  when: xcode_clt.rc != 0
  changed_when: true
  failed_when: false
  tags: [macos, packages]

- name: Stop when Xcode Command Line Tools must be installed manually
  ansible.builtin.fail:
    msg: "Xcode Command Line Tools installer launched. Complete install, then rerun setup.sh."
  when: xcode_clt.rc != 0
  tags: [macos, packages]

- name: Check Go
  ansible.builtin.command: go version
  register: macos_go_check
  changed_when: false
  failed_when: false
  tags: [macos, go]

- name: Fetch latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: macos_go_version_response
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Set Go version
  ansible.builtin.set_fact:
    macos_go_version: "{{ (macos_go_version_response.content.splitlines() | first | default('go1.23.0')) | regex_replace('^go', '') }}"
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Select Go architecture
  ansible.builtin.set_fact:
    macos_goarch: "{{ 'arm64' if ansible_facts.architecture == 'arm64' else 'amd64' }}"
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Download Go package
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ macos_go_version }}.darwin-{{ macos_goarch }}.pkg"
    dest: "/tmp/go{{ macos_go_version }}.darwin-{{ macos_goarch }}.pkg"
    mode: "0644"
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Install Go package
  become: true
  ansible.builtin.command:
    argv:
      - installer
      - -pkg
      - "/tmp/go{{ macos_go_version }}.darwin-{{ macos_goarch }}.pkg"
      - -target
      - /
  changed_when: true
  when: macos_go_check.rc != 0
  tags: [macos, go]

- name: Check Homebrew (required for nvm)
  ansible.builtin.command: command -v brew
  register: macos_brew_check
  changed_when: false
  failed_when: false
  tags: [macos, node]

- name: Warn when Homebrew is missing
  ansible.builtin.debug:
    msg: "Homebrew not found; skipping nvm/Node.js. Install Homebrew (or run `brew bundle`) and rerun."
  when: macos_brew_check.rc != 0
  tags: [macos, node]

- name: Check Homebrew nvm
  ansible.builtin.command: brew list nvm
  register: macos_nvm_check
  changed_when: false
  failed_when: false
  when: macos_brew_check.rc == 0
  tags: [macos, node]

- name: Install nvm via Homebrew
  ansible.builtin.command: brew install nvm
  when:
    - macos_brew_check.rc == 0
    - macos_nvm_check.rc != 0
  tags: [macos, node]

- name: Ensure NVM_DIR exists
  # Homebrew nvm does not create its working dir; zsh/.homebrew.zshrc sources from ~/.nvm.
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.nvm"
    state: directory
    mode: "0755"
  when: macos_brew_check.rc == 0
  tags: [macos, node]

- name: Install Node.js LTS and set as default (nvm)
  ansible.builtin.shell: |
    set -e
    export NVM_DIR="$HOME/.nvm"
    . "$(brew --prefix nvm)/nvm.sh"
    nvm install --lts
    nvm alias default 'lts/*'
  args:
    executable: /bin/zsh
  register: macos_nvm_lts
  changed_when: "'is already installed' not in macos_nvm_lts.stderr"
  when: macos_brew_check.rc == 0
  tags: [macos, node]
