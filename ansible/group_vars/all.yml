---
# Shared dotfiles setup variables.

dotfiles_dir: "{{ playbook_dir | dirname }}"
local_bin_dir: "{{ ansible_facts.env.HOME }}/.local/bin"
zsh_plugin_dir: "{{ ansible_facts.env.HOME }}/.local/share/zsh/plugins"

stow_packages:
  - agents
  - claude
  - ghostty
  - git
  - gnupg
  - nvim
  - opencode
  - pi
  - postgresql
  - ssh
  - tmux
  - zed
  - zsh

stow_common_args:
  - stow
  - --no-folding
  - --target={{ ansible_facts.env.HOME }}
  - --dir={{ dotfiles_dir }}

stow_conflict_files:
  - "{{ ansible_facts.env.HOME }}/.zshrc"
  - "{{ ansible_facts.env.HOME }}/.homebrew.zshrc"
  - "{{ ansible_facts.env.HOME }}/.gdt.zshrc"
  # Pi writes real settings.json/mcp.json on first run; clear them so stow can
  # symlink the repo copies. auth.json/sessions/npm/git/bin stay machine-local.
  - "{{ ansible_facts.env.HOME }}/.pi/agent/settings.json"
  - "{{ ansible_facts.env.HOME }}/.pi/agent/mcp.json"
  # Claude Code writes real settings.json/statusline on first run; clear them so
  # stow can symlink the repo copies. settings.local.json, credentials, cache,
  # sessions and other state stay machine-local (not in the claude package).
  - "{{ ansible_facts.env.HOME }}/.claude/settings.json"
  - "{{ ansible_facts.env.HOME }}/.claude/statusline-command.sh"
  # skills CLI writes a real lockfile at $XDG_STATE_HOME/skills on first run
  # (set in zsh/.zshrc); clear it so stow can symlink it to the repo-tracked
  # agents/.agents/.skill-lock.json instead, keeping one lockfile in sync.
  - "{{ ansible_facts.env.HOME }}/.local/state/skills/.skill-lock.json"

zsh_plugins:
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting

nerd_fonts_version: v3.2.1
nerd_fonts:
  - FiraCode
  - JetBrainsMono

go_tools:
  - module: github.com/go-delve/delve/cmd/dlv
    binary: dlv
  - module: github.com/jandelgado/gcov2lcov
    binary: gcov2lcov
  - module: mvdan.cc/gofumpt
    binary: gofumpt
  - module: golang.org/x/tools/cmd/goimports
    binary: goimports
  - module: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
    binary: golangci-lint
  - module: github.com/haya14busa/goplay/cmd/goplay
    binary: goplay
  - module: golang.org/x/tools/gopls
    binary: gopls
  - module: github.com/cweill/gotests/gotests
    binary: gotests
  - module: github.com/josharian/impl
    binary: impl
  - module: github.com/vektra/mockery/v2
    binary: mockery
  - module: github.com/mgechev/revive
    binary: revive
  - module: honnef.co/go/tools/cmd/staticcheck
    binary: staticcheck

# Global npm packages (installed via the nvm-managed Node.js). On macOS these previously lived
# in the Brewfile as `npm "..."` lines, which `brew bundle` does not support.
npm_packages:
  - "@earendil-works/pi-coding-agent"
  - "@openai/codex"
  - context-mode
  - corepack
  - gitnexus
  - tree-sitter-cli

linux_base_packages:
  - curl
  - wget
  - unzip
  - xz-utils
  - gpg
  - ca-certificates
  - build-essential
  - fontconfig

linux_cli_packages:
  - stow
  - tmux
  - bat
  - ripgrep
  - fd-find
  - fzf
  - jq
  - tree
  - htop
  - postgresql-client
  - pgformatter
  - sqitch
  - libdbd-pg-perl
  - pass
  - git-crypt
  - python3
  - python3-pip
  - mpv
  - zsh

linux_github_binaries:
  # nvim is installed by tasks/linux_nvim.yml (the generic single-binary task drops nvim's
  # runtime/ tree, which Neovim requires). Keep it out of this loop.
  - name: tree-sitter
    repo: tree-sitter/tree-sitter
    asset_pattern: "tree-sitter-cli-linux-{{ linux_ts_arch }}\\.zip"
    skip: false
  - name: lazygit
    repo: jesseduffield/lazygit
    asset_pattern: "lazygit_.*_Linux_{{ linux_arch }}\\.tar\\.gz"
    skip: false
  - name: lazysql
    repo: jorgerojas26/lazysql
    asset_pattern: "lazysql_linux_{{ linux_arch }}\\.tar\\.gz"
    skip: false
  - name: act
    repo: nektos/act
    asset_pattern: "act_Linux_{{ linux_arch }}\\.tar\\.gz"
    skip: false
  - name: actionlint
    repo: rhysd/actionlint
    asset_pattern: "actionlint_.*_linux_{{ linux_arch }}\\.tar\\.gz"
    skip: false
  - name: htmlq
    repo: mgdm/htmlq
    asset_pattern: "htmlq-x86_64-linux\\.tar\\.gz"
    skip: "{{ linux_arch != 'amd64' }}"
  - name: saml2aws
    repo: Versent/saml2aws
    asset_pattern: "saml2aws_.*_linux_{{ linux_arch }}\\.tar\\.gz"
    skip: "{{ linux_arch != 'amd64' }}"

linux_direct_binaries:
  - name: dbmate
    url: "https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-{{ linux_arch }}"
